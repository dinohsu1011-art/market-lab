<head>

<body>
<div class="page">
  <main>
    <div id="top">
      <h1>Full ranking</h1>
      <div class="sub" id="sub">&nbsp;</div>
      <div id="rkBar">
        <div class="chips" id="rkUni" role="group" aria-label="What to rank"></div>
        <form class="find" id="rkGroup" role="search"><input type="search" placeholder="Sector or theme" aria-label="Filter by sector or theme" autocomplete="off" spellcheck="false"><ul hidden></ul></form>
        <button type="button" id="rkPicked" hidden></button>
        <form class="find" id="rkTextForm" role="search"><input type="search" id="rkText" placeholder="Ticker or name" aria-label="Filter by ticker or name" autocomplete="off" spellcheck="false"></form>
        <span class="stamp" id="stamp"></span>
      </div>
      <p id="rkNote" role="status" hidden></p>
      <table id="rkTable" class="rk"><thead class="stick"></thead><tbody></tbody></table>
      <div id="rkMore"></div>
    </div>
  </main>
</div>
<script src="market-lab-eq.js?v=20261119-7821156e"></script>
