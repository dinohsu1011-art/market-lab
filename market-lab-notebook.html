  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    /* Two bound notepads side by side (Dino, 2026-11-11, second pass: "elegant and pure").
       Cloth head binding with a foil-stamped name, a block of fine paper, a silk ribbon.
       Blueprint: dot-grid paper; contents page of trade ideas, then one page per idea
       with execution, result and a success/failure mark (blind-embossed seal).
       Gospel: plain paper; rules and philosophy as one numbered list.
       Click a page to flip it up. nb-data is written by research/market-reads/notebook.py.
       Show only Dino's content: no helper lines or captions. */
    :root {
      --np-navy:#1d2740; --np-ox:#5e1d1c; --np-green:#1f3a31; --np-foil-a:#f1e6c6; --np-foil-b:#b89d6e;
      --np-paper:#fbfaf6; --np-sheet:#f1efe8; --np-edge:#dcd8cd; --np-dot:rgba(29,39,64,.17); --np-hair:rgba(29,39,64,.16);
      --np-ink:#1f2230; --np-soft:#5b5f6b; --np-faint:#9a9ca3; --np-fail:#9b2f24;
      --np-disp:"Cormorant Garamond", "Cormorant", Garamond, serif; --np-text:"EB Garamond", Garamond, Georgia, serif;
    }
    :root[data-theme="dark"] {
      --np-paper:#ece9e1; --np-sheet:#dedad0; --np-edge:#c9c4b8; --np-navy:#1a2338; --np-ox:#561a19;
    }
    .nb-wrap { max-width:1220px; margin:0 auto; padding:48px 32px 160px; }
    .nb-head { display:flex; justify-content:space-between; align-items:baseline; gap:24px; margin:0 0 56px; }
    .nb-head h1 { font:500 44px/1 var(--np-disp); letter-spacing:-.4px; margin:0; color:var(--ml-ink); }
    .nb-upd { color:var(--ml-faint); font-size:13px; margin:0; }

    .nb-desk { display:grid; grid-template-columns:1fr 1fr; gap:72px; align-items:start; }
    .pad { position:relative; padding-bottom:58px; animation:np-in .5s cubic-bezier(.2,.7,.2,1) backwards; }
    .pad-ox { animation-delay:.08s; }
    @keyframes np-in { from { opacity:0; transform:translateY(12px); } }
    .pad:focus-visible { outline:none; }
    .pad:focus-visible .pad-pages { outline:1px solid var(--ml-faint); outline-offset:10px; }

    /* Cloth head binding, name stamped in foil */
    .pad-top { position:relative; z-index:20; height:48px; display:flex; align-items:center; justify-content:center; border-radius:2px 2px 0 0;
      background-color:var(--np-navy);
      background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
                       repeating-linear-gradient(90deg, rgba(0,0,0,.09) 0 1px, transparent 1px 3px),
                       linear-gradient(to bottom, rgba(255,255,255,.06), rgba(0,0,0,.14));
      box-shadow:0 2px 3px -1px rgba(0,0,0,.28); }
    .pad-ox .pad-top { background-color:var(--np-ox); }
    .pad-top h2 { margin:0; font:italic 500 24px/1 var(--np-disp); letter-spacing:.6px;
      background:linear-gradient(170deg, var(--np-foil-a) 20%, var(--np-foil-b) 55%, var(--np-foil-a) 85%);
      -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 -1px 0 rgba(0,0,0,.35)); }

    /* The paper block */
    .pad-pages { position:relative; z-index:2; display:grid; perspective:2400px; background:var(--np-paper);
      box-shadow:0 1px 0 var(--np-edge), 0 2px 0 var(--np-sheet), 0 3px 0 var(--np-edge), 0 4px 0 var(--np-sheet), 0 5px 0 var(--np-edge),
                 0 6px 0 var(--np-sheet), 0 7px 0 var(--np-edge), 0 40px 60px -36px rgba(10,14,24,.42), 0 2px 10px rgba(10,14,24,.05); }
    .pg { grid-area:1/1; position:relative; min-height:680px; padding:64px 60px 92px; color:var(--np-ink); background-color:var(--np-paper);
      transform-origin:top center; transition:transform .7s cubic-bezier(.45,.05,.25,1), box-shadow .7s; backface-visibility:hidden; -webkit-backface-visibility:hidden;
      cursor:pointer; }
    .pg::after { content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .7s;
      background:linear-gradient(to bottom, rgba(10,14,24,.0), rgba(10,14,24,.18)); }
    .pg.gone { transform:rotateX(176deg); pointer-events:none; }
    .pg.gone::after { opacity:1; }
    .pad-navy .pg { background-image:radial-gradient(circle at 1px 1px, var(--np-dot) 1px, transparent 1.3px); background-size:22px 22px; background-position:19px 19px; }

    /* Silk ribbon marker */
    .ribbon { position:absolute; z-index:1; left:64px; bottom:6px; width:10px; height:60px; background:var(--np-navy);
      background-image:linear-gradient(90deg, rgba(255,255,255,.12), rgba(255,255,255,0) 40%, rgba(0,0,0,.18));
      clip-path:polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%); transform:rotate(2deg); transform-origin:top center; }
    .pad-ox .ribbon { background-color:var(--np-ox); left:auto; right:72px; transform:rotate(-2deg); }

    .folio { position:absolute; z-index:30; left:0; right:0; bottom:78px; display:flex; justify-content:center; align-items:center; gap:10px;
      font:400 14px/1 var(--np-text); font-variant-numeric:oldstyle-nums; color:var(--np-faint); pointer-events:none; }
    .folio button { all:unset; pointer-events:auto; cursor:pointer; padding:4px 8px; font:400 20px/1 var(--np-disp); color:var(--np-faint); transition:color .15s; }
    .folio button:hover { color:var(--np-ink); }
    .folio button:disabled { opacity:.3; cursor:default; }
    .folio button:focus-visible { outline:1px solid var(--np-soft); }
    .folio[hidden] { display:none; }

    /* Blueprint: contents */
    .trk { list-style:none; margin:0; padding:0; }
    .trk button { all:unset; box-sizing:border-box; width:100%; display:grid; grid-template-columns:56px 1fr 18px; align-items:baseline; column-gap:10px;
      padding:10px 0; cursor:pointer; }
    .trk li + li button { border-top:1px solid var(--np-hair); }
    .trk .d { font:italic 400 13.5px/1 var(--np-text); font-variant-numeric:oldstyle-nums; color:var(--np-faint); }
    .trk .t { display:flex; align-items:baseline; font:500 20px/1.2 var(--np-disp); color:var(--np-ink); transition:color .15s; }
    .trk .t::after { content:""; flex:1; min-width:18px; margin:0 6px 0 12px; border-bottom:1px dotted rgba(29,39,64,.35); transform:translateY(-4px); }
    .trk button:hover .t, .trk button:focus-visible .t { color:var(--np-navy); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:5px; }
    .trk .g { align-self:center; display:grid; place-items:center; }
    .glyph { width:16px; height:16px; fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
    .glyph.success { stroke:var(--np-ink); }
    .glyph.failure { stroke:var(--np-fail); }
    .glyph.open { stroke:var(--np-faint); stroke-width:1; }

    /* Blueprint: one page per date, every idea from that date on it */
    .pg-date { display:block; margin:0 0 22px; font:italic 500 28px/1 var(--np-disp); font-variant-numeric:oldstyle-nums; color:var(--np-ink); }
    .ent { position:relative; padding:20px 0 22px; border-top:1px solid var(--np-hair); }
    .idea { margin:0 0 8px; padding-right:64px; font:600 22px/1.15 var(--np-disp); color:var(--np-ink); }
    .said { position:relative; margin:0 0 14px; font:italic 400 14px/1.5 var(--np-text); color:var(--np-soft); }
    .said::before { content:"\201C"; position:absolute; left:-.55em; top:-.02em; color:var(--np-faint); }
    .said::after { content:"\201D"; color:var(--np-faint); }
    .flds { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin:0; }
    .fld dt { margin:0 0 3px; font:italic 400 12.5px/1 var(--np-text); color:var(--np-faint); }
    .fld dd { margin:0; min-height:22px; padding-bottom:2px; border-bottom:1px solid var(--np-hair); font:400 14.5px/1.45 var(--np-text); font-variant-numeric:oldstyle-nums; color:var(--np-ink); }
    .marks { display:flex; gap:22px; margin-top:14px; }
    .marks button { all:unset; display:flex; align-items:center; gap:10px; cursor:pointer; font:400 13.5px/1 var(--np-text); color:var(--np-soft); transition:color .15s; }
    .marks button:hover, .marks button[aria-pressed="true"] { color:var(--np-ink); }
    .marks button[data-mark="failure"][aria-pressed="true"] { color:var(--np-fail); }
    .marks button:focus-visible { outline:1px solid var(--np-soft); outline-offset:5px; }
    .marks .ring { width:11px; height:11px; border:1px solid currentColor; border-radius:50%; display:grid; place-items:center; }
    .marks .ring::after { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; transform:scale(0); transition:transform .15s; }
    .marks button[aria-pressed="true"] .ring::after { transform:scale(1); }
    .seal { position:absolute; top:14px; right:0; width:56px; height:56px; opacity:0; transform:rotate(-12deg) scale(.9);
      transition:opacity .25s, transform .25s; pointer-events:none; }
    .seal.on { opacity:1; transform:rotate(-12deg) scale(1); }
    .seal svg { width:100%; height:100%; fill:none; overflow:visible; }
    .seal .r1 { stroke-width:1.2; } .seal .r2 { stroke-width:.6; } .seal .gl { stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .seal text { font:500 8.6px var(--np-text); letter-spacing:2.6px; fill:currentColor; stroke:none; }
    .seal.success { color:var(--np-navy); } .seal.failure { color:var(--np-fail); }
    .seal svg * { stroke:currentColor; }
    .seal svg { filter:drop-shadow(0 1px 0 rgba(255,255,255,.9)) drop-shadow(0 -.5px 0 rgba(0,0,0,.12)); opacity:.86; }

    /* Claude: wide ruled pad under the two, one page per read date, two columns */
    .pad-wide { margin-top:80px; animation-delay:.16s; }
    .pad-green .pad-top { background-color:var(--np-green); }
    .pad-green .ribbon { background-color:var(--np-green); left:50%; }
    .pad-green .pg { min-height:560px; background-image:repeating-linear-gradient(to bottom, transparent 0 27px, rgba(31,58,49,.11) 27px 28px); background-position:0 52px; }
    .pad-green .trk, .cols { columns:2; column-gap:72px; }
    .pad-green .trk li, .pad-green .ent { break-inside:avoid; }
    .pad-green .trk li + li button { border-top:0; }
    .pad-green .trk button { border-bottom:1px solid var(--np-hair); }
    .ent .hz { display:block; margin:0 0 5px; font:italic 400 12.5px/1 var(--np-text); color:var(--np-faint); }
    .cols .ent { padding-top:16px; }
    .cols .ent:first-child { border-top:0; padding-top:0; }
    .glyph.hit { stroke:var(--np-ink); } .glyph.miss { stroke:var(--np-fail); }

    /* Gospel */
    .gos { list-style:none; margin:0; padding:0; counter-reset:g; }
    .gos li { display:grid; grid-template-columns:44px 1fr; column-gap:8px; padding:0 0 30px; margin:0 0 30px; border-bottom:1px solid var(--np-hair); }
    .gos li:last-child { border-bottom:0; }
    .gos .n { font:italic 400 30px/1.1 var(--np-disp); color:var(--np-ox); font-variant-numeric:oldstyle-nums; }
    .gos .tx { display:block; font:500 33px/1.12 var(--np-disp); letter-spacing:-.2px; color:var(--np-ink); }
    .gos .dt { display:block; margin-top:12px; font:italic 400 14px/1 var(--np-text); font-variant-numeric:oldstyle-nums; color:var(--np-faint); }

    @media (max-width:900px) {
      .nb-wrap { padding:28px 16px 100px; }
      .nb-head { flex-direction:column; gap:6px; margin-bottom:36px; }
      .nb-desk { grid-template-columns:1fr; gap:48px; }
      .pg { min-height:540px; padding:44px 28px 84px 36px; }
      .flds { grid-template-columns:1fr; gap:12px; }
      .gos .tx { font-size:28px; }
      .pad-wide { margin-top:48px; }
      .pad-green .trk, .cols { columns:1; }
    }
    @media (prefers-reduced-motion:reduce) { .pad { animation:none; } .pg, .pg::after, .seal { transition:none; } }
  </style>

  try { local = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(local)); } catch (e) {} }
  function markOf(i) { return Object.prototype.hasOwnProperty.call(local, i.id) ? local[i.id] : i.mark; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var PATH = { success: 'M4 12.5 L9.5 18 L20 6', failure: 'M6 6 L18 18 M18 6 L6 18', hit: 'M4 12.5 L9.5 18 L20 6', miss: 'M6 6 L18 18 M18 6 L6 18', open: 'M12 5 A7 7 0 1 1 11.99 5' };
  function seal(m) {
    var good = m === 'success' || m === 'hit', word = m.toUpperCase(), g = good ? 'M38 50.5 L46 58.5 L62 40' : 'M40 40 L60 60 M60 40 L40 60';
    return '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><path id="arc-' + m + '" d="M50 50 m-35 0 a35 35 0 1 1 70 0 a35 35 0 1 1 -70 0"/></defs>' +
      '<circle class="r1" cx="50" cy="50" r="46"/><circle class="r2" cx="50" cy="50" r="42.5"/><circle class="r2" cx="50" cy="50" r="27"/>' +
      '<text><textPath href="#arc-' + m + '" startOffset="0">' + word + ' \u00B7 ' + word + ' \u00B7 </textPath></text>' +
      '<path class="gl" d="' + g + '"/></svg>';
  }
  function glyph(kind) { return '<svg class="glyph ' + kind + '" viewBox="0 0 24 24" aria-hidden="true"><path d="' + PATH[kind] + '"/></svg>'; }

  function pad(el, pages) {
    var stack = el.querySelector('.pad-pages'), fol = el.querySelector('.folio'), num = fol.querySelector('span');
    var prev = fol.querySelector('.prev'), next = fol.querySelector('.next'), n = pages.length, cur = 0;
    stack.innerHTML = pages.map(function (h, i) { return '<article class="pg" style="z-index:' + (n - i) + '">' + h + '</article>'; }).join('');
    var pgs = Array.prototype.slice.call(stack.children);
    fol.hidden = n < 2;
    function go(k) {
      cur = Math.max(0, Math.min(n - 1, k));
      pgs.forEach(function (p, i) { p.classList.toggle('gone', i < cur); p.inert = i !== cur; p.setAttribute('aria-hidden', i !== cur); });
      num.textContent = (cur + 1) + ' / ' + n; prev.disabled = cur === 0; next.disabled = cur === n - 1;
    }
    stack.addEventListener('click', function (e) { if (e.target.closest('button')) return; go(cur === n - 1 ? 0 : cur + 1); });
    prev.addEventListener('click', function () { go(cur - 1); });
    next.addEventListener('click', function () { go(cur + 1); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { go(cur + 1); e.preventDefault(); }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { go(cur - 1); e.preventDefault(); }
    });
    go(0);
    return { go: go, stack: stack };
  }

  // Blueprint: contents page, then one page per date holding every idea from that date.
  var ideas = D.ideas, days = [], dayOf = {};
  ideas.forEach(function (it) {
    if (!(it.date in dayOf)) { dayOf[it.date] = days.length; days.push({ date: it.date, items: [] }); }
    days[dayOf[it.date]].items.push(it);
  });
  var tracker = '<ul class="trk">' + ideas.map(function (it) {
    return '<li><button data-go="' + (dayOf[it.date] + 1) + '"><span class="d">' + esc(it.date) + '</span><span class="t">' + esc(it.title) + '</span><span class="g" data-id="' + esc(it.id) + '"></span></button></li>';
  }).join('') + '</ul>';
  function lines(arr) { return arr.map(function (x) { return '<div>' + esc(x) + '</div>'; }).join(''); }
  function entry(it) {
    var mk = ['success', 'failure'].map(function (m) {
      return '<button data-mark="' + m + '" data-id="' + esc(it.id) + '" aria-pressed="false"><span class="ring"></span>' + (m === 'success' ? 'Success' : 'Failure') + '</button>';
    }).join('');
    return '<section class="ent"><h3 class="idea">' + esc(it.title) + '</h3>' +
      (it.said ? '<p class="said">' + esc(it.said) + '</p>' : '') +
      '<dl class="flds"><div class="fld"><dt>Execution</dt><dd>' + lines(it.execution) + '</dd></div>' +
      '<div class="fld"><dt>Result</dt><dd>' + (it.result ? '<div>' + esc(it.result) + '</div>' : '') + '</dd></div></dl>' +
      '<div class="marks">' + mk + '</div><div class="seal" data-stamp="' + esc(it.id) + '"></div></section>';
  }
  var pages = [tracker].concat(days.map(function (d) {
    return '<span class="pg-date">' + esc(d.date) + '</span>' + d.items.map(entry).join('');
  }));
  var bp = pad(document.getElementById('blueprint'), pages);
  function paint(id) {
    var it = ideas.filter(function (x) { return x.id === id; })[0], m = markOf(it);
    bp.stack.querySelectorAll('.g[data-id="' + id + '"]').forEach(function (g) { g.innerHTML = glyph(m || 'open'); });
    bp.stack.querySelectorAll('[data-mark][data-id="' + id + '"]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.mark === m); });
    var st = bp.stack.querySelector('[data-stamp="' + id + '"]');
    if (st) { st.className = 'seal' + (m ? ' on ' + m : ''); if (m) st.innerHTML = seal(m); }
  }
  ideas.forEach(function (it) { paint(it.id); });
  bp.stack.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]');
    if (g) { bp.go(+g.dataset.go); return; }
    var b = e.target.closest('[data-mark]');
    if (!b) return;
    var it = ideas.filter(function (x) { return x.id === b.dataset.id; })[0];
    local[it.id] = markOf(it) === b.dataset.mark ? null : b.dataset.mark;
    save(); paint(it.id);
  });

  // Gospel: rules and philosophy, four to a page.
  var G = D.gospel, per = 4, gp = [];
  for (var i = 0; i < Math.max(1, G.length); i += per) {
    gp.push('<ol class="gos">' + G.slice(i, i + per).map(function (g) {
      return '<li><span class="n">' + g.n + '</span><div><span class="tx">' + esc(g.text) + '</span><span class="dt">' + esc(g.date) + '</span></div></li>';
    }).join('') + '</ol>');
  }
  pad(document.getElementById('gospel'), gp);

  // Claude: contents page, then one page per read date, newest first. Graded by grade.py.
  var C = D.calls || [], cp = [];
  if (C.length) {
    cp.push('<ul class="trk">' + C.map(function (d, k) {
      return d.items.map(function (c) {
        var g = c.result === 'open' ? 'open' : c.result;
        return '<li><button data-go="' + (k + 1) + '"><span class="d">' + esc(d.date) + '</span><span class="t">' + esc(c.text) + '</span><span class="g">' + glyph(g) + '</span></button></li>';
      }).join('');
    }).join('') + '</ul>');
    C.forEach(function (d) {
      cp.push('<span class="pg-date">' + esc(d.date) + '</span><div class="cols">' + d.items.map(function (c) {
        var done = c.result === 'hit' || c.result === 'miss';
        return '<section class="ent"><span class="hz">' + esc(c.horizon) + '</span><h3 class="idea">' + esc(c.text) + '</h3>' +
          (c.reason ? '<p class="said">' + esc(c.reason) + '</p>' : '') +
          '<dl class="flds"><div class="fld"><dt>Check on</dt><dd>' + esc(c.check) + '</dd></div>' +
          '<div class="fld"><dt>Result</dt><dd>' + esc(c.detail) + '</dd></div></dl>' +
          '<div class="seal' + (done ? ' on ' + (c.result === 'hit' ? 'success' : 'failure') : '') + '">' + (done ? seal(c.result) : '') + '</div></section>';
      }).join('') + '</div>');
    });
    var cl = pad(document.getElementById('claude'), cp);
    cl.stack.addEventListener('click', function (e) { var g = e.target.closest('[data-go]'); if (g) cl.go(+g.dataset.go); });
  }

  // Both notepads stay the same size: each paper block takes the taller one's height.
  var stacks = Array.prototype.slice.call(document.querySelectorAll('.nb-desk .pad-pages'));
  function equalize() {
    stacks.forEach(function (st) { st.style.minHeight = ''; });
    var h = Math.max.apply(null, stacks.map(function (st) { return st.offsetHeight; }));
    stacks.forEach(function (st) { st.style.minHeight = h + 'px'; });
  }
  equalize();
  window.addEventListener('resize', equalize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(equalize);
})();
</script>
</body>
</html>
